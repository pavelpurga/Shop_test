name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (if package.json exists)
        if: always()
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Build site (Vite)
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # If project contains a Vite build, compute repo name and set VITE_BASE so assets use the repo subpath
          if [ -f package.json ] && grep -q "vite build" package.json; then
            REPO_NAME=${GITHUB_REPOSITORY#*/}
            echo "Computed repo name: $REPO_NAME"
            export VITE_BASE="/$REPO_NAME/"
            echo "VITE_BASE=$VITE_BASE"
            # export for npm scripts
            echo "VITE_BASE=$VITE_BASE" >> $GITHUB_ENV
            npm run build
          else
            echo "No Vite build detected — skipping build"
          fi

      - name: Prepare publish directory
        run: |
          if [ -d dist ]; then
            echo "PUBLISH_DIR=dist" >> $GITHUB_ENV
          elif [ -d docs ]; then
            echo "PUBLISH_DIR=docs" >> $GITHUB_ENV
          elif [ -d _site ]; then
            echo "PUBLISH_DIR=_site" >> $GITHUB_ENV
          else
            echo "No publish directory found (dist, docs or _site)" && exit 1
          fi
          echo "Will publish: $PUBLISH_DIR"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
