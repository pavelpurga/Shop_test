name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy-jekyll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Jekyll dependencies or fallback
        run: |
          # determine source dir: docs/ if exists, otherwise repo root
          if [ -d docs ]; then SRC=docs; else SRC=.; fi
          echo "Source dir: $SRC"
          # If Gemfile exists in source, use bundler, otherwise install jekyll gem globally
          if [ -f "$SRC/Gemfile" ]; then
            echo "Gemfile found in $SRC — using Bundler"
            cd "$SRC"
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs 4 --retry 3
          else
            echo "No Gemfile found in $SRC — installing jekyll gem"
            gem install jekyll bundler --no-document
          fi

      - name: Build Jekyll site
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          if [ -d docs ]; then SRC=docs; else SRC=.; fi
          DEST="$GITHUB_WORKSPACE/_site"
          echo "Building from: $SRC to $DEST"
          if [ -f "$SRC/Gemfile" ]; then
            echo "Building with bundle exec"
            cd "$SRC"
            bundle exec jekyll build --destination "$DEST"
          else
            echo "Building with system jekyll"
            jekyll build --source "$SRC" --destination "$DEST"
          fi

      - name: "Debug: verify GH_PAGES_PAT and repo permissions"
        if: ${{ always() }}
        run: |
          echo "Checking GH_PAGES_PAT availability and permissions"
          # Check if secret is available in this run
          if [ -z "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo "GH_PAGES_PAT is not set or not available in this workflow run"
          else
            echo "GH_PAGES_PAT appears to be set (value is masked)"
          fi

          echo "Token user info:"
          curl -s -H "Authorization: token ${{ secrets.GH_PAGES_PAT }}" https://api.github.com/user || echo "User info request failed"

          echo "Repo permissions:"
          curl -s -H "Authorization: token ${{ secrets.GH_PAGES_PAT }}" https://api.github.com/repos/${{ github.repository }} || echo "Repo info request failed"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
