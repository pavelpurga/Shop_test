name: Deploy to gh-pages branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # use the personal access token for git operations (so push from action uses this token)
          token: ${{ secrets.GH_PAGES_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI: true
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          echo "Computed repo name: $REPO_NAME"
          echo "VITE_BASE=/${REPO_NAME}/" >> $GITHUB_ENV
          npm run build

      - name: Verify PAT can access repo (diagnostic)
        env:
          GH_PAT: ${{ secrets.GH_PAGES_PAT }}
        run: |
          echo "Checking PAT access (token will be masked in logs)"
          # Verify we can reach the remote and list refs using the PAT
          git ls-remote https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} | head -n 5

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          # if you want to preserve files on gh-pages set keep_files: true
