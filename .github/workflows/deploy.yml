name: Deploy to gh-pages branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI: true
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          echo "Computed repo name: $REPO_NAME"
          echo "VITE_BASE=/${REPO_NAME}/" >> $GITHUB_ENV
          npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          # if you want to preserve files on gh-pages set keep_files: true
