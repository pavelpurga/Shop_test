<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Shop Test</title>
    <meta name="description" content="Shop Test — простой каталог товаров с корзиной."/>
    <link rel="preconnect" href="https://images.weserv.nl" crossorigin>
    <link rel="preconnect" href="https://fakestoreapi.com">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" as="script"
          crossorigin="anonymous">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" as="script"
          crossorigin="anonymous">
    <script defer crossorigin="anonymous"
            src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script defer crossorigin="anonymous"
            src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            try {
                const links = Array.from(document.querySelectorAll('link[rel="preload"][as="image"]'))
                links.forEach(l => {
                    const href = l.getAttribute('href') || ''
                    if (href.includes('images.weserv.nl')) {
                        l.parentNode && l.parentNode.removeChild(l)
                    }
                })
            } catch (e) {

            }
        }, 2000)
    })
</script>
<script type="module" src="src/main.tsx"></script>
</body>
</html>
